name: Lint markdown files
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      # for details on the this action, see: https://github.com/DavidAnson/markdownlint-cli2-action
      - uses: DavidAnson/markdownlint-cli2-action@v25.1.0
